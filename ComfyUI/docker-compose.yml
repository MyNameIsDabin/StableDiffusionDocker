services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comfyui
    ports:
      - "8188:8188"
    volumes:
      # ============================================
      # 1) 모델 카탈로그 전체를 먼저 깐다
      # ============================================
      # ComfyUI가 업데이트되면서 새 모델 카테고리(text_encoders, detection,
      # audio_encoders ...)가 계속 생긴다. 하나씩 마운트하면 빠뜨린 폴더가
      # 컨테이너 쓰기 레이어에 쌓이고, 재생성할 때 통째로 날아간다.
      # 통째로 깔아두면 새 카테고리가 생겨도 자동으로 호스트에 남는다.
      - /app/comfyui/models:/app/ComfyUI/models

      # ============================================
      # 2) 기존 SD WebUI 폴더를 그 위에 덮는다
      # ============================================
      # 도커는 마운트 지점을 경로 깊이 순으로 적용하므로,
      # 위의 통짜 마운트보다 아래 항목들이 나중에 적용된다.

      # 체크포인트 (UNet+CLIP+VAE 통짜 모델)
      - /app/models/Stable-diffusion:/app/ComfyUI/models/checkpoints

      # 확산 가중치만 있는 모델. ComfyUI는 unet 과 diffusion_models 를
      # 같은 카테고리로 취급하므로 둘 중 아무 데나 넣어도 된다.
      - /app/models/unet:/app/ComfyUI/models/unet
      - /app/models/diffusion_models:/app/ComfyUI/models/diffusion_models

      - /app/models/Lora:/app/ComfyUI/models/loras
      - /app/embeddings:/app/ComfyUI/models/embeddings
      - /app/models/VAE:/app/ComfyUI/models/vae
      - /app/models/VAE-approx:/app/ComfyUI/models/vae_approx
      - /app/extensions/sd-webui-controlnet/models:/app/ComfyUI/models/controlnet
      - /app/models/ESRGAN:/app/ComfyUI/models/upscale_models
      - /app/models/clip:/app/ComfyUI/models/clip
      - /app/models/clip_vision:/app/ComfyUI/models/clip_vision
      - /app/models/hypernetworks:/app/ComfyUI/models/hypernetworks

      # ============================================
      # 3) 앱 데이터
      # ============================================
      - /app/comfyui/custom_nodes:/app/ComfyUI/custom_nodes
      - /app/comfyui/user:/app/ComfyUI/user
      - /app/outputs:/app/ComfyUI/output
      - /app/inputs:/app/ComfyUI/input
      - /app/comfyui/temp:/app/ComfyUI/temp

      # 커스텀 노드가 받아오는 허깅페이스 모델 캐시.
      # 마운트하지 않으면 재생성할 때마다 십수 GB를 다시 받는다.
      # 경로가 user 아래인 이유는 README '심볼릭 링크로 빼둔 것' 참고.
      - /app/comfyui/user/hf-cache:/home/comfyuser/.cache/huggingface

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HOME=/home/comfyuser/.cache/huggingface
      # 1 로 두면 시작할 때 커스텀 노드 의존성 설치를 건너뛴다
      - SKIP_NODE_DEPS=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
